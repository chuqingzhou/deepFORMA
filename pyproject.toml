[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepforma"
version = "0.1.0"
description = "Minimal, reproducible code for FORMA organoid MRI segmentation and database construction."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Chuqing Zhou"},
  {name = "Xinyi Ren"},
  {name = "Shiyingnan Gao"},
  {name = "Youhui Jiang"},
  {name = "Xiaoyi Tian"},
  {name = "Jun Zhao"},
  {name = "Mengshan Fu"},
  {name = "Qingmei Wang"},
  {name = "Liansheng Zhao"},
  {name = "Qiang Wang"},
  {name = "Wanjun Guo"},
  {name = "Tao Li"},
  {name = "Peiyan Ni"},
]
keywords = [
  "brain organoid",
  "magnetic resonance imaging",
  "segmentation",
  "atlas",
  "phenotyping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26,<1.27",
  "pandas>=2.2,<2.3",
  "h5py>=3.10,<3.11",
  "pynrrd>=1.0,<1.1",
  "scipy>=1.11,<1.12",
  "scikit-image>=0.22,<0.23",
  "openpyxl>=3.1,<3.2",
  "tqdm>=4.66,<4.67",
]

[project.urls]
Homepage = "https://github.com/chuqingzhou/deepFORMA"
Repository = "https://github.com/chuqingzhou/deepFORMA"
"Supporting data" = "https://doi.org/10.5281/zenodo.19406546"

[tool.setuptools]
packages = ["deepforma", "deepforma.features", "deepforma.io", "deepforma.model", "deepforma.segmentation"]

